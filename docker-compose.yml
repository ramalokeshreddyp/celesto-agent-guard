services:
  ledger:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    volumes:
      - ./seeds:/docker-entrypoint-initdb.d
      - ledger_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://ledger:ledger@ledger:5432/ledger
      API_PORT: "8080"
      CELESTO_PROVIDER: ${CELESTO_PROVIDER:-cloud}
      CELESTO_API_KEY: ${CELESTO_API_KEY:-replace-me}
      CELESTO_BACKEND: ${CELESTO_BACKEND:-firecracker}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-replace-me}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    depends_on:
      ledger:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  ledger_data:
